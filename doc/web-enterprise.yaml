# Profile: Web Application with a Rust Backend (Axum, SQLx/SQLite) — any frontend
# Browser-facing business application, optionally multi-tenant, processing personal data. No formal safety case;
# security (OWASP ASVS 5.0 L2), privacy (GDPR) and operability are paramount.
#
# Frontend options (pick one, see `rulesets:` below):
#   * server-rendered pages (Askama)          -> base rulesets only
#   * htmx                                    -> + doc/rules/rust-web-htmx.yaml
#   * SPA (TypeScript or Rust/WASM)           -> base rulesets only; add the frontend's build/lint/test to the gate
#     (e.g. lint.command: "cargo clippy --all-targets --all-features -- -D warnings && npm run lint" — a command
#     replaces the built-in check, so repeat it)
#   * PWA (installable / offline)             -> like SPA + doc/rules/rust-web-pwa.yaml
#
# Project setup (aegis init --profile web-enterprise --lang rust --name <project> creates these):
#   Cargo.toml + crates/<project>-{domain,application,storage,api,server}, tests/, migrations/, openapi/
#               (layered workspace; the layer policy is gate.architecture below)
#   docs/{user,operator,technical,hosting}/  four MkDocs sites (RULE-RWE-100), docs/build.sh (HTML + PDF),
#   docs/collect-legal.sh + about.toml (SBOM and third-party licenses for /admin-help, RULE-RWE-104)
#   clippy.toml  <- templates/rust-web/clippy.toml     (one per workspace, superset of the rust template)
#   deny.toml    <- templates/rust/deny.toml           (bans openssl/native-tls, license policy)
#   Cargo.toml   <- templates/rust/workspace-lints.toml ([workspace.lints]: unwrap_used, disallowed_methods, ...)

profile: web-enterprise
description: >
  Web application with a Rust backend (Axum, SQLx/SQLite) and a server-rendered, htmx or SPA/PWA frontend,
  session-based authentication, optional multi-tenant isolation and personal data. Secure by default (ASVS 5.0
  Level 2), privacy by design (GDPR Art. 25), no third-party requests from the browser, fail-closed error handling.
rigor: none             # No safety integrity level; security & privacy reviews are mandatory instead
language: rust

# --- Rulesets (Modular Composition) ------------------------------------------
# Order matters only for readability; all three are loaded. The web overlay assumes the other two.
rulesets:
  - doc/rules/rust-strict.yaml            # language core (RULE-RS-*)
  - doc/rules/rust-service.yaml           # long-running service (RULE-RSV-*)
  - doc/rules/rust-web-enterprise.yaml    # web, ASVS, GDPR — frontend-neutral (RULE-RWE-*)
  # - doc/rules/rust-web-htmx.yaml        # optional: htmx frontends (RULE-RWH-*)
  # - doc/rules/rust-web-pwa.yaml         # optional: PWAs — service worker, offline sync, push (RULE-RWP-*)

# --- 1. Quality Axes (ISO/IEC 25010:2023) ------------------------------------
quality_axes:
  functional_suitability: required
  security:               required      # ASVS L2: authN/MFA, sessions, CSRF, tenant isolation, CSP
  reliability:            required      # transactional state changes, graceful shutdown, fail-closed dependencies
  maintainability:        required
  interaction_capability: required      # accessibility (WCAG 2.2 AA), keyboard use; offline behaviour for PWAs
  performance_efficiency: recommended   # p95 page latency budgets from the non-functional requirements
  compatibility:          recommended   # evergreen browsers; versioned migrations
  flexibility:            recommended   # container or systemd deployment from one artefact
  safety:                 not_applicable

# --- 2. Gate Stages ----------------------------------------------------------
gate:
  build:
    active: true
  architecture:
    active: true                 # crate graph = architecture (RULE-RWE-090); checked via cargo metadata
    # layer -> layers it may depend on. Crates match by name suffix: <project>-domain is layer `domain`.
    layers:
      domain: []
      application: [domain]
      storage: [domain, application]
      api: [domain, application]
      server: [domain, application, storage, api]
      tests: ["*"]
    # layer -> the only third-party crates it may depend on (dev-dependencies exempt; RULE-RWE-094)
    allowed:
      domain: [serde, thiserror, uuid, time, chrono, rust_decimal, secrecy]
    # third-party crate -> layers that may depend on it directly (all others: allowed everywhere)
    restricted:
      sqlx: [storage, tests]
      reqwest: [storage]
      axum: [api, server, tests]
      axum-extra: [api]
      tower-http: [api, server]
      tower-sessions: [api, server]
      askama: [api]
      tokio: [storage, api, server, tests]
      hyper: [server]
      web-push: [storage]          # RULE-RWP-006: push delivery is an outbound adapter
      tracing-subscriber: [server]
  lint:
    active: true                 # clippy -D warnings + rulesets' gate_commands (fmt, template scans) + deviation scan
    fail_on: warning
  static_analysis:
    active: true                 # cargo check + rustdoc -D warnings (rust-strict gate_commands)
  security:
    active: true                 # built-in: cargo-deny (deny.toml) + cargo-audit when installed
    checks: [dependency_audit, license_scan, sources]
    # secrets_scan: gitleaks runs via rust-web-enterprise toolchain.gate_commands.security
  test_freeze:
    active: true                 # tests are implemented + reviewed first, then frozen (aegis tests freeze)
  tests:
    active: true
    levels: [unit, integration, http]   # http: router-level tests (tower::ServiceExt::oneshot) incl. security tests;
                                        # SPA/PWA: add frontend unit + e2e tests (e.g. Playwright) via tests.command
  coverage:
    active: true
    metric: line                 # cargo-llvm-cov on stable
    threshold: 80
    fail_below: true
  mutation:
    active: true
    threshold: 70                # cargo-mutants; locally `cargo mutants --in-diff` for fast feedback
    packages: ["*-domain", "*-application"]   # business logic; adapters are covered by integration tests
  load_test:
    active: true
    # The scenario asserts the latency/throughput budgets of the non-functional requirements itself (k6 thresholds).
    command: "k6 run --quiet load/slo.js"
  traceability:
    active: true
    bidirectional: false
    paths: [crates, tests]
    baseline: required           # approved doc/baseline.lock; changed REQs mark downstream links SUSPECT
    documentation: required      # docs/<handbook>/: every UC documented in the handbook of its audience
  deliverables:
    active: true                 # + SBOM, licenses and the four handbooks via rust-web-enterprise toolchain.gate_commands
  reviews:
    active: true
    # Security-relevant: two independent reviewers for architecture and for the implementation.
    required: [spec, requirements, "architecture:2", testplan, "implementation:2", documentation]

# --- 2b. Implementation Loop (see doc/prompts/06_27b_implementation.md) -------
agent_loop:
  max_iterations: 3
  fast_stages: [build, architecture, lint, test_freeze, tests]
  max_task_tokens: 6000          # aegis tasks packet budget: size it to the implementation model's context

# --- 3. Deliverables ---------------------------------------------------------
deliverables:
  - container_image              # OCI image (distroless/static, non-root) or .deb + systemd unit
  - sbom                         # CycloneDX JSON (cargo cyclonedx)
  - database_migrations          # migrations/ applied by sqlx::migrate!, forward-only
  - deployment_manifest          # compose / Helm / systemd, incl. reverse-proxy and TLS configuration
  - data_inventory               # doc/privacy/data-inventory.yaml (RULE-RWE-071)
  - records_of_processing        # GDPR Art. 30, derived from the data inventory
  - privacy_notice               # what is processed, purposes, retention, data subject rights
  - security_test_report         # ASVS L2 verification: requirement -> test mapping (traceability matrix)
  - user_manual                  # docs/user: HTML under /help (+ optional German edition) and PDF
  - operator_manual              # docs/operator: HTML under /admin-help (admins only) and PDF; incl. SBOM + licenses
  - technical_manual             # docs/technical: architecture, integration, API reference (from OpenAPI); PDF/HTML
  - hosting_manual               # docs/hosting: installation, configuration reference, backup, upgrade; PDF/HTML
  - third_party_notices          # cargo-about license page; browser-delivered code notices reachable for all users
  - coverage_report
  - traceability_matrix
  - operations_guide             # backup/restore (incl. encrypted replicas), key rotation, incident response
  - changelog

# --- 4. Coding Constraints (Strict Directives for the Implementation Model) --
coding_constraints:
  - "Respect the crate layers: domain is pure, use cases depend on ports (traits) in application, adapters live in storage/api, only server wires them (RULE-RWE-090/091). Never add a dependency the layer policy forbids."
  - Every route is authenticated and role-checked through typed extractors unless listed in public_routes (RULE-RWE-021).
  - Every query on tenant data takes a TenantScope from the session and filters tenant_id in SQL (RULE-RWE-020).
  - SQL only via sqlx::query!/query_as!/query_scalar! or QueryBuilder::push_bind (RULE-RWE-001).
  - Server HTML only from Askama templates; client rendering only via text APIs / framework escaping; no inline scripts or styles (RULE-RWE-002, -042).
  - Session credentials only in the HttpOnly cookie; personal data in browser storage only for inventory categories marked offline (RULE-RWE-043).
  - Personal data only as Pii<T>; never log, Debug-print or serialize it outside the export DTOs (RULE-RWE-070).
  - Every new table column is classified in doc/privacy/data-inventory.yaml in the same change (RULE-RWE-071).
  - Errors from validation or dependencies abort the action; never continue with default values (RULE-RWE-060).
  - Every @implements annotation must state the REQ-ID of the realized requirement.

# --- 5. Agent Instructions Fragment -----------------------------------------
agent_instructions: |
  TARGET PLATFORM: Web application with a Rust backend (Axum, SQLx with SQLite); the frontend variant (server-rendered
  Askama, htmx, or SPA/PWA) and its extra rules come from the rulesets listed in the profile.
  Security and privacy are acceptance criteria, not polish: every handler takes a typed input DTO with
  deny_unknown_fields, converts it into validated domain types, checks the caller's role through an extractor and
  scopes every data access to the session's tenant. Build server-side HTML only in Askama templates with
  auto-escaping, return JSON APIs with serde, render untrusted data on the client only through text APIs or the
  framework's escaping, and keep every page CSP-compatible (no inline script/style, no eval). Use only checked SQL macros or
  QueryBuilder with push_bind. Wrap personal data in Pii<T>. Return generic error pages with a correlation ID and log
  details with tracing as structured fields. Read configuration only in the config module. Do not add crates, routes
  that bypass authentication, CORS layers or outbound HTTP calls that the instructions do not name.
  When a requirement is ambiguous, stop and report the ambiguity instead of guessing.
