[package]
name = "aegis"
version = "0.1.0"
edition = "2021"
description = "Aegis: Spec-Driven Systems Engineering Toolkit (Traceability, Impact Analysis, Issues, Profiles, and Quality Gate)"

[dependencies]
clap = { version = "4.5", features = ["derive", "color"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
regex = "1.10"
walkdir = "2.5"
colored = "3.1"
anyhow = "1.0"
chrono = "0.4"

[[bin]]
name = "aegis"
path = "src/main.rs"

[lib]
name = "aegis"
path = "src/lib.rs"
